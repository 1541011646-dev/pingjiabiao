<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培智学校职业教育质量评价系统</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233498db'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white'%3E评%3C/text%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }

/* 登录页 */
.login-screen { text-align: center; padding-top: 60px; }
.login-screen h1 { font-size: 26px; color: #2c3e50; margin-bottom: 12px; }
.login-screen .subtitle { color: #7f8c8d; margin-bottom: 35px; }
.input-group { max-width: 400px; margin: 0 auto 20px; text-align: left; }
.input-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; }
.input-group input { width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color .2s; }
.input-group input:focus { border-color: #3498db; }
.btn-primary { background: #3498db; color: #fff; border: none; padding: 14px 40px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 8px; transition: background .2s; }
.btn-primary:hover { background: #2980b9; }
.btn-secondary { background: #ecf0f1; color: #333; border: none; padding: 12px 28px; font-size: 15px; border-radius: 8px; cursor: pointer; margin: 8px; transition: background .2s; }
.btn-secondary:hover { background: #d5dbdb; }
.school-tab.active { background: #3498db; color: #fff; }
.btn-danger { background: #e74c3c; color: #fff; border: none; padding: 10px 24px; font-size: 14px; border-radius: 6px; cursor: pointer; margin: 5px; }
.btn-danger:hover { background: #c0392b; }

/* 答题页 */
.progress-bar { position: sticky; top: 0; background: #fff; padding: 12px 0; z-index: 100; border-bottom: 1px solid #eee; }
.progress-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #666; }
.progress-track { height: 6px; background: #ecf0f1; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: #3498db; border-radius: 3px; transition: width .3s; }

.section-title { font-size: 20px; font-weight: 600; color: #2c3e50; margin: 30px 0 15px; padding-left: 12px; border-left: 4px solid #3498db; }
.subsection-title { font-size: 16px; font-weight: 500; color: #555; margin: 20px 0 10px; padding-left: 8px; border-left: 3px solid #95a5a6; }

.question-card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.question-text { font-size: 16px; font-weight: 500; margin-bottom: 15px; color: #2c3e50; }
.question-num { display: inline-block; background: #3498db; color: #fff; width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 50%; font-size: 14px; margin-right: 8px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option-item { display: flex; align-items: flex-start; padding: 12px 15px; border: 2px solid #eee; border-radius: 8px; cursor: pointer; transition: all .2s; }
.option-item:hover { border-color: #3498db; background: #f8f9fa; }
.option-item.selected { border-color: #3498db; background: #ebf5fb; }
.option-radio { width: 18px; height: 18px; border: 2px solid #bbb; border-radius: 50%; margin-right: 12px; margin-top: 2px; flex-shrink: 0; position: relative; }
.option-item.selected .option-radio { border-color: #3498db; }
.option-item.selected .option-radio::after { content: ''; position: absolute; top: 3px; left: 3px; width: 8px; height: 8px; background: #3498db; border-radius: 50%; }
.option-label { font-size: 14px; color: #555; }
.option-score { display: inline-block; background: #ecf0f1; padding: 2px 8px; border-radius: 4px; font-size: 12px; color: #666; margin-right: 8px; font-weight: 500; }

.nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; padding-bottom: 50px; }

/* 结果页 */
.result-screen { padding-top: 20px; }
.result-summary { background: linear-gradient(135deg, #3498db, #2c3e50); color: #fff; border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 25px; }
.result-summary .total-score { font-size: 48px; font-weight: 700; margin: 10px 0; }
.result-summary .score-label { font-size: 16px; opacity: 0.9; }
.result-summary .grade { font-size: 20px; margin-top: 10px; padding: 6px 20px; background: rgba(255,255,255,0.2); border-radius: 20px; display: inline-block; }

.section-score-card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.section-score-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-score-name { font-size: 16px; font-weight: 600; color: #2c3e50; }
.section-score-value { font-size: 20px; font-weight: 700; color: #3498db; }
.score-bar { height: 8px; background: #ecf0f1; border-radius: 4px; overflow: hidden; margin-top: 8px; }
.score-bar-fill { height: 100%; border-radius: 4px; transition: width .5s; }

.analysis-box { background: #fff; border-radius: 10px; padding: 25px; margin-top: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.analysis-box h3 { font-size: 18px; margin-bottom: 15px; color: #2c3e50; }
.analysis-box p { margin-bottom: 10px; color: #555; font-size: 14px; }
.strength-item, .weakness-item { padding: 10px 15px; border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
.strength-item { background: #e8f8f5; border-left: 4px solid #27ae60; }
.weakness-item { background: #fdedec; border-left: 4px solid #e74c3c; }

/* 汇总页 */
.summary-screen { padding-top: 20px; }
.summary-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
.summary-table th, .summary-table td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; }
.summary-table th { background: #3498db; color: #fff; font-weight: 500; }
.summary-table tr:last-child td { border-bottom: none; }
.summary-table .avg-row { background: #f0f7ff; font-weight: 600; }
.summary-table .name-col { text-align: left; padding-left: 15px; }

.empty-tip { text-align: center; padding: 60px 20px; color: #999; }

.hidden { display: none; }
@media print { .no-print { display: none; } body { background: #fff; } }
@media (max-width: 600px) {
  .container { padding: 12px; }
  .summary-table th, .summary-table td { padding: 8px 5px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="container">

<!-- ===== 登录页 ===== -->
<div id="loginScreen" class="login-screen">
  <h1>培智学校职业教育质量评价系统</h1>
  <p class="subtitle">多学校版</p>
  <div id="schoolLoginArea">
    <div class="input-group">
      <label>学校名称</label>
      <input type="text" id="loginSchool" placeholder="请输入学校全称">
    </div>
    <button class="btn-primary" onclick="schoolLogin()">开始填写</button>
    <div style="margin-top:20px;">
      <a href="javascript:void(0)" onclick="showAdminLogin()" style="color:#3498db;font-size:14px;">管理员入口</a>
    </div>
  </div>
  <div id="adminLoginArea" style="display:none;">
    <div class="input-group">
      <label>管理员密码</label>
      <input type="password" id="adminPassword" placeholder="请输入管理员密码">
    </div>
    <button class="btn-primary" onclick="adminLogin()">管理员登录</button>
    <div style="margin-top:20px;">
      <a href="javascript:void(0)" onclick="showSchoolLogin()" style="color:#3498db;font-size:14px;">返回学校填写</a>
    </div>
  </div>
</div>

<!-- ===== 首页（登录后） ===== -->
<div id="homeScreen" class="login-screen hidden">
  <h1 id="welcomeText">欢迎使用</h1>
  <p class="subtitle" id="homeSchoolName"></p>
  <div style="margin-top:25px;">
    <button class="btn-primary" onclick="startQuiz()">开始新评价</button>
    <button class="btn-secondary" onclick="showSummary()" id="summaryBtn" style="display:none;">查看汇总数据</button>
  </div>
  <div id="adminImportArea" style="margin-top:15px;display:none;">
    <button class="btn-secondary" onclick="document.getElementById('importFile').click()">导入学校数据</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
  <div id="exportArea" style="margin-top:15px;display:none;">
    <button class="btn-secondary" onclick="exportData()">导出本校数据</button>
  </div>
  <div id="evalCountTip" style="margin-top:20px;color:#999;font-size:14px;"></div>
  <div style="margin-top:30px;">
    <button class="btn-secondary" onclick="logout()">退出登录</button>
  </div>
</div>

<!-- ===== 答题页 ===== -->
<div id="quizScreen" class="hidden">
  <div class="progress-bar">
    <div class="progress-info">
      <span id="progressText">已答 0 / 55</span>
      <span id="currentSection">A1 立德树人</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div id="quizContent"></div>
  <div class="nav-buttons">
    <button class="btn-secondary" onclick="prevSection()">上一部分</button>
    <button class="btn-primary" onclick="submitQuiz()" id="submitBtn" style="display:none">提交评价</button>
    <button class="btn-secondary" onclick="nextSection()" id="nextBtn">下一部分</button>
  </div>
</div>

<!-- ===== 单人结果页 ===== -->
<div id="resultScreen" class="result-screen hidden">
  <h2 style="margin-bottom:20px;color:#2c3e50;">评价结果报告</h2>
  <div id="resultInfo" style="margin-bottom:20px;color:#666;font-size:14px;"></div>
  <div class="result-summary">
    <div class="score-label">综合得分（满分100分）</div>
    <div class="total-score" id="totalScore">0</div>
    <div class="grade" id="gradeText"></div>
  </div>
  <h3 class="section-title">各一级指标得分</h3>
  <div id="sectionScores"></div>
  <div class="analysis-box">
    <h3>评价分析报告</h3>
    <div id="analysisContent"></div>
  </div>
  <div style="text-align:center;margin-top:30px;padding-bottom:50px;">
    <button class="btn-secondary no-print" onclick="window.print()">打印结果</button>
    <button class="btn-primary no-print" onclick="goHome()">返回首页</button>
  </div>
</div>

<!-- ===== 汇总页 ===== -->
<div id="summaryScreen" class="summary-screen hidden">
  <h2 style="margin-bottom:20px;color:#2c3e50;" id="summaryTitle">多人评价汇总</h2>
  <div id="summaryInfo" style="margin-bottom:20px;color:#666;font-size:14px;"></div>
  <div id="summaryContent"></div>
  <div style="text-align:center;margin-top:30px;padding-bottom:50px;">
    <button class="btn-secondary no-print" onclick="window.print()">打印汇总报告</button>
    <button class="btn-danger no-print" onclick="clearMyData()">清空本校数据</button>
    <button class="btn-primary no-print" onclick="goHome()">返回首页</button>
  </div>
</div>

</div>

<script>
// ===== 数据：55道题 =====
const DATA = [
  { aCode: "A1", aName: "立德树人与培养目标", aWeight: 14.20, bCode: "B1.1", bName: "立德树人", bWeight: 4.84,
    questions: [
      { cCode: "C1", text: "请您结合本校实际情况，评价立德树人根本任务的落实情况", weight: 4.84,
        options: ["尚未开展：本校基本未开展立德树人相关工作","初步开展：仅个别育人环节有涉及，效果不明显","正常开展：有开展相关工作但不够系统，效果一般","较好落实：主要育人环节都有安排，有一定效果","全面落实：五育并举和思政教育贯穿教学全过程，有成熟做法和成果材料可查"] }
    ]
  },
  { aCode: "A1", aName: "立德树人与培养目标", aWeight: 14.20, bCode: "B1.2", bName: "培养目标", bWeight: 4.52,
    questions: [
      { cCode: "C2", text: "请您评价本校职业技能训练目标的明确程度", weight: 1.60,
        options: ["无目标：本校无明确的技能训练目标","目标模糊：目标笼统，与岗位要求脱节","基本明确：目标基本明确，但操作性不强","较明确：目标较清晰，基本可操作，与岗位有一定对接","非常明确：目标清晰具体、可量化，与岗位要求对接，并分解到各阶段教学计划"] },
      { cCode: "C3", text: "请您评价本校生活适应能力培养目标的明确程度", weight: 1.54,
        options: ["无目标：本校无生活适应培养目标","目标模糊：目标不清晰，未有效落实","基本明确：目标基本明确，但落实不够具体","较明确：目标较明确，基本落地执行","非常明确：生活适应目标具体明确，与学生实际相适切，纳入课程并分阶段落实"] },
      { cCode: "C4", text: "请您评价本校培养目标对缺陷补偿与潜能开发的体现程度", weight: 1.38,
        options: ["未体现：目标基本未体现缺陷补偿与潜能开发，也无相关措施","体现不足：目标体现不够，缺乏有效措施","有所体现：目标有一定体现，但措施不够具体","较充分：目标体现较充分，有相应措施并基本执行","充分体现：目标充分体现缺陷补偿与潜能开发，且有具体可操作的措施并落实到位"] }
    ]
  },
  { aCode: "A1", aName: "立德树人与培养目标", aWeight: 14.20, bCode: "B1.3", bName: "规划与管理", bWeight: 4.84,
    questions: [
      { cCode: "C5", text: "请您评价本校职业教育工作纳入学校发展规划的情况", weight: 1.69,
        options: ["未纳入：职教工作未纳入学校发展规划","流于形式：未正式纳入规划，或纳入但仅停留在纸面","基本纳入：有一般性安排","已纳入：纳入规划，有相应安排和年度计划","重点纳入：列入学校发展规划并单列重点，有专项计划、逐年推进、成效可见"] },
      { cCode: "C6", text: "请您评价本校年度职业教育任务与责任分工的明晰程度", weight: 1.58,
        options: ["无分工：本校无年度任务和责任分工","不清晰：任务笼统，责任不清","基本清晰：任务基本明确，但执行一般","较清晰：任务与分工较明确，基本能推进","非常清晰：年度任务明确、逐项分解到部门和责任人，权责清晰、按时完成"] },
      { cCode: "C7", text: "请您评价本校职业教育质量监测与持续改进机制的建立情况", weight: 1.58,
        options: ["无机制：本校无质量监测和改进机制","机制缺失：有框架但流于形式，未能运转","基本建立：有基本机制，但运行一般","较完善：机制较完善，能正常运转","闭环完善：建立了完整的监测—反馈—改进闭环，有数据支撑、持续改进、效果明显"] }
    ]
  },
  { aCode: "A2", aName: "组织与制度保障", aWeight: 13.25, bCode: "B2.1", bName: "党的领导", bWeight: 2.87,
    questions: [
      { cCode: "C8", text: "请您评价党对本校职业教育工作的全面领导落实情况", weight: 2.87,
        options: ["未落实：党组织对职教工作领导基本未落实","落实不到位：领导责任落实不到位","基本落实：有基本机制，落实一般","较健全：领导机制较健全，基本落实","全面落实：党组织全面领导职教工作，决策议事和保障机制健全、落到实处"] }
    ]
  },
  { aCode: "A2", aName: "组织与制度保障", aWeight: 13.25, bCode: "B2.2", bName: "管理制度", bWeight: 2.68,
    questions: [
      { cCode: "C9", text: "请您评价本校职业教育专项管理与质量监控制度的完备程度", weight: 2.68,
        options: ["无制度：本校无专项管理制度","制度缺失：制度不健全或执行不力","基本完备：有基本制度，执行一般","较完备：制度较完备，执行较好","健全完善：专项管理和质量监控制度健全完善，执行严格、覆盖全程"] }
    ]
  },
  { aCode: "A2", aName: "组织与制度保障", aWeight: 13.25, bCode: "B2.3", bName: "经费保障", bWeight: 2.68,
    questions: [
      { cCode: "C10", text: "请您评价本校职业教育经费专款专用及投入稳定情况", weight: 2.68,
        options: ["严重不足：经费未专款专用或严重不足","投入不足：经费有挪用或投入不足","基本稳定：基本做到专款专用，投入一般","较稳定：专款专用，投入基本稳定","稳定充足：经费专款专用、投入稳定充足，保障各项职教活动正常开展并有账可查"] }
    ]
  },
  { aCode: "A3", aName: "课程建设", aWeight: 15.46, bCode: "B3.1", bName: "课程设置", bWeight: 4.14,
    questions: [
      { cCode: "C11", text: "请您评价本校公共基础课程与职业技能课程结构配置的合理程度", weight: 0.97,
        options: ["严重失衡：两类课程结构严重失衡","不太合理：结构失衡，课时不足","基本合理：结构基本合理","较合理：结构较合理，基本落实","科学合理：两类课程比例结构科学合理，与培养目标匹配，课时落实充分"] },
      { cCode: "C12", text: "请您评价本校课程设置与智力障碍学生认知特征的匹配程度", weight: 1.06,
        options: ["完全不匹配：课程与学生认知水平差距很大","不太匹配：明显超出或脱离学生实际","基本适配：课程难度基本适配","较适配：较适配，基本符合学生实际","充分适配：课程内容和难度充分适配学生认知水平，个别化差异得到体现"] },
      { cCode: "C13", text: "请您评价本校生活适应类课程的设置情况", weight: 1.06,
        options: ["未设置：本校无生活适应类课程","形同虚设：虽有设置但未实际开展","基本设置：有设置，落实一般","较系统：设置较系统，基本落实","系统完善：系统设置生活适应类课程，内容贴近生活、课时充足、效果明显"] },
      { cCode: "C14", text: "请您评价本校劳动教育与职业体验活动的开展情况", weight: 1.06,
        options: ["未开展：本校未开展劳动教育和职业体验活动","偶尔开展：极少开展或流于形式","定期开展：有开展，但频次一般","较常态：活动较经常，覆盖面尚可","常态化：统筹规划、常态化开展，覆盖面广、学生参与充分"] }
    ]
  },
  { aCode: "A3", aName: "课程建设", aWeight: 15.46, bCode: "B3.2", bName: "课程内容", bWeight: 4.14,
    questions: [
      { cCode: "C15", text: "请您评价本校课程内容与岗位典型工作任务的对接程度", weight: 1.33,

// ===== 工具 =====
function calcScores(ans) {
  const aScores = {};
  let totalScore = 0;
  for (const b of DATA) {
    if (!aScores[b.aCode]) aScores[b.aCode] = { score: 0, maxScore: 0, name: b.aName };
    for (const q of b.questions) {
      const score = ans[q.cCode] || 0;
      const weighted = score / 5 * q.weight;
      aScores[b.aCode].score += weighted;
      aScores[b.aCode].maxScore += q.weight;
      totalScore += weighted;
    }
  }
  return { totalScore, aScores };
}

function getGrade(percent) {
  if (percent >= 90) return '优秀';
  if (percent >= 80) return '良好';
  if (percent >= 70) return '中等';
  if (percent >= 60) return '合格';
  return '需改进';
}

function exportData() {
  const data = getStorage();
  const schoolData = data.schools[currentUser.name];
  if (!schoolData || schoolData.records.length === 0) { alert('暂无数据可导出'); return; }
  const exportObj = {
    schoolName: currentUser.name,
    exportTime: new Date().toLocaleString(),
    records: schoolData.records
  };
  const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentUser.name}_评价数据.json`;
  a.click();
  URL.revokeObjectURL(url);
  alert('数据已导出，请将文件发给管理员');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const importObj = JSON.parse(e.target.result);
      if (!importObj.schoolName || !importObj.records) { alert('文件格式不正确'); return; }
      const data = getStorage();
      if (!data.schools[importObj.schoolName]) data.schools[importObj.schoolName] = { records: [] };
      // 合并记录，按id去重
      const existingIds = new Set(data.schools[importObj.schoolName].records.map(r => r.id));
      let added = 0;
      for (const r of importObj.records) {
        if (!existingIds.has(r.id)) {
          data.schools[importObj.schoolName].records.push(r);
          added++;
        }
      }
      setStorage(data);
      alert(`成功导入「${importObj.schoolName}」${added} 份评价`);
      refreshHomeTip();
    } catch(err) {
      alert('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== 答题 =====
function startQuiz() {
  answers = {};
  currentSection = 0;
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  renderQuiz();
}

function renderQuiz() {
  const b = DATA[currentSection];
  const container = document.getElementById('quizContent');
  let html = `<div class="section-title">${b.aCode} ${b.aName}</div>`;
  html += `<div class="subsection-title">${b.bCode} ${b.bName}</div>`;
  b.questions.forEach((q) => {
    const globalIdx = getGlobalIndex(q.cCode);
    html += `<div class="question-card" id="card-${q.cCode}">`;
    html += `<div class="question-text"><span class="question-num">${globalIdx+1}</span>${q.text}</div><div class="options">`;
    q.options.forEach((opt, oi) => {
      const score = oi + 1;
      const selected = answers[q.cCode] === score ? 'selected' : '';
      html += `<div class="option-item ${selected}" onclick="selectOption('${q.cCode}', ${score}, this)"><div class="option-radio"></div><div class="option-label"><span class="option-score">${score}分</span>${opt}</div></div>`;
    });
    html += `</div></div>`;
  });
  container.innerHTML = html;
  updateProgress();
  updateNavButtons();
}

function getGlobalIndex(cCode) {
  let count = 0;
  for (const b of DATA) for (const q of b.questions) { if (q.cCode === cCode) return count; count++; }
  return -1;
}

function selectOption(cCode, score, el) {
  answers[cCode] = score;
  const card = document.getElementById('card-' + cCode);
  card.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(answers).length;
  document.getElementById('progressText').textContent = `已答 ${answered} / ${totalQuestions}`;
  document.getElementById('progressFill').style.width = (answered / totalQuestions * 100) + '%';
  const b = DATA[currentSection];
  document.getElementById('currentSection').textContent = `${b.aCode} ${b.aName} - ${b.bCode}`;
}

function updateNavButtons() {
  document.getElementById('nextBtn').style.display = currentSection === DATA.length - 1 ? 'none' : 'block';
  document.getElementById('submitBtn').style.display = currentSection === DATA.length - 1 ? 'block' : 'none';
  document.getElementById('nextBtn').textContent = currentSection === DATA.length - 1 ? '提交评价' : '下一部分';
}

function nextSection() {
  // 检查当前板块是否都答完
  const b = DATA[currentSection];
  const unanswered = b.questions.filter(q => !answers[q.cCode]);
  if (unanswered.length > 0) {
    alert(`本板块还有 ${unanswered.length} 道题未作答，请全部答完再跳转`);
    return;
  }
  if (currentSection < DATA.length - 1) { currentSection++; renderQuiz(); window.scrollTo(0,0); }
  else submitQuiz();
}
function prevSection() {
  if (currentSection > 0) { currentSection--; renderQuiz(); window.scrollTo(0,0); }
}

function submitQuiz() {
  const answered = Object.keys(answers).length;
  if (answered < totalQuestions) {
    if (!confirm(`还有 ${totalQuestions - answered} 道题未作答，确定提交吗？`)) return;
  }
  const sd = getCurrentSchoolData();
  const { totalScore, aScores } = calcScores(answers);
  const record = {
    id: sd.records.length + 1,
    time: new Date().toLocaleString(),
    answers: { ...answers },
    totalScore: totalScore,
    aScores: aScores
  };
  showResult(record);
  try {
    sd.records.push(record);
    saveCurrentSchoolData(sd);
  } catch(e) {
    console.warn('本地存储失败', e);
  }
}

// ===== 单人结果页 =====
function showResult(record) {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('resultInfo').innerHTML = `学校：${currentUser.name}｜第 ${record.id} 份评价｜时间：${record.time}`;
  document.getElementById('totalScore').textContent = record.totalScore.toFixed(1);
  const percent = record.totalScore;
  const grade = getGrade(percent);
  document.getElementById('gradeText').textContent = `等级：${grade}（${percent.toFixed(0)}%）`;

  let sectionHtml = '';
  for (const aCode in record.aScores) {
    const a = record.aScores[aCode];
    const aPercent = a.score / a.maxScore * 100;
    let color = aPercent >= 80 ? '#27ae60' : aPercent >= 60 ? '#f39c12' : '#e74c3c';
    sectionHtml += `<div class="section-score-card"><div class="section-score-header"><span class="section-score-name">${aCode} ${a.name}</span><span class="section-score-value" style="color:${color}">${a.score.toFixed(1)} / ${a.maxScore.toFixed(1)}</span></div><div class="score-bar"><div class="score-bar-fill" style="width:${aPercent}%;background:${color}"></div></div></div>`;
  }
  document.getElementById('sectionScores').innerHTML = sectionHtml;
  generateAnalysis(record.aScores, record.totalScore, grade);
  window.scrollTo(0,0);
}

function generateAnalysis(aScores, totalScore, grade) {
  const sorted = Object.entries(aScores).sort((a, b) => b[1].score/b[1].maxScore - a[1].score/a[1].maxScore);
  let html = `<p><strong>总体评价：</strong>综合得分 ${totalScore.toFixed(1)} 分，等级为「${grade}」。`;
  if (grade === '优秀') html += '学校职教工作各方面表现突出。';
  else if (grade === '良好') html += '整体开展较好，个别板块仍有提升空间。';
  else if (grade === '中等') html += '基本达标，部分板块需重点加强。';
  else if (grade === '合格') html += '基本合格，但多项指标存在明显短板。';
  else html += '存在较多不足，需系统性整改提升。';
  html += `</p>`;
  html += `<p style="margin-top:12px;"><strong>优势：</strong>${sorted[0][0]} ${sorted[0][1].name}（得分率 ${(sorted[0][1].score/sorted[0][1].maxScore*100).toFixed(0)}%）</p>`;
  html += `<p style="margin-top:8px;"><strong>待改进：</strong>${sorted[sorted.length-1][0]} ${sorted[sorted.length-1][1].name}（得分率 ${(sorted[sorted.length-1][1].score/sorted[sorted.length-1][1].maxScore*100).toFixed(0)}%）</p>`;
  document.getElementById('analysisContent').innerHTML = html;
}

}

  });
  // 切换显示内容
  document.querySelectorAll('.school-detail').forEach((detail, i) => {
    detail.style.display = i === idx ? 'block' : 'none';
  });
}

function renderSummaryTable(records, schoolName, existingHtml) {
  const aCodes = Object.keys(records[0].aScores);
  let html = existingHtml || '';

  html += '<table class="summary-table"><thead><tr><th>序号</th>';
  for (const aCode of aCodes) {
    html += `<th>${aCode}</th>`;
  }
  html += '<th>总分</th><th>等级</th></tr></thead><tbody>';

  const avgScores = {};
  for (const aCode of aCodes) avgScores[aCode] = { sum: 0, maxSum: 0 };
  let totalSum = 0;

  for (const r of records) {
    html += `<tr><td class="name-col">第${r.id}份</td>`;
    for (const aCode of aCodes) {
      const a = r.aScores[aCode];
      const pct = (a.score / a.maxScore * 100).toFixed(0);
      let color = a.score/a.maxScore >= 0.8 ? '#27ae60' : a.score/a.maxScore >= 0.6 ? '#f39c12' : '#e74c3c';
      html += `<td style="color:${color};font-weight:500">${a.score.toFixed(1)}<br><span style="font-size:11px;color:#999">${pct}%</span></td>`;
      avgScores[aCode].sum += a.score;
      avgScores[aCode].maxSum += a.maxScore;
    }
    totalSum += r.totalScore;
    html += `<td style="font-weight:700;color:#3498db">${r.totalScore.toFixed(1)}</td><td>${getGrade(r.totalScore)}</td></tr>`;
  }

  const avgTotal = totalSum / records.length;
  html += `<tr class="avg-row"><td class="name-col">平均分</td>`;
  for (const aCode of aCodes) {
    const avg = avgScores[aCode].sum / records.length;
    const max = avgScores[aCode].maxSum / records.length;
    const pct = (avg / max * 100).toFixed(0);
    html += `<td>${avg.toFixed(1)}<br><span style="font-size:11px;color:#666">${pct}%</span></td>`;
  }
  html += `<td style="color:#2c3e50">${avgTotal.toFixed(1)}</td><td>${getGrade(avgTotal)}</td></tr>`;
  html += '</tbody></table>';

  // 专业分析（只有学校自己的汇总页才显示）
  if (!existingHtml) {
    const avgList = Object.entries(avgScores).map(([k, v]) => ({
      code: k, name: records[0].aScores[k].name,
      avgScore: v.sum / records.length, maxScore: v.maxSum / records.length
    })).sort((a, b) => b.avgScore/b.maxScore - a.avgScore/a.maxScore);

    const avgGrade = getGrade(avgTotal);
    html += '<div class="analysis-box"><h3>综合分析报告</h3>';
    html += `<div style="background:#f8f9fa;padding:15px;border-radius:8px;margin-bottom:20px;">`;
    html += `<p style="font-size:15px;line-height:1.8;"><strong>一、整体情况</strong></p>`;
    html += `<p style="margin-top:8px;line-height:1.8;">本次评价共收集 <strong>${records.length}</strong> 位评价人的有效问卷，平均综合得分 <strong>${avgTotal.toFixed(1)}</strong> 分，整体等级为「<strong>${avgGrade}</strong>」。</p>`;
    html += `</div>`;

    const top2 = avgList.slice(0, 2);
    html += `<p style="font-size:15px;margin-bottom:10px;"><strong>二、优势板块分析</strong></p>`;
    for (const s of top2) {
      const rate = s.avgScore / s.maxScore * 100;
      const info = A_ANALYSIS[s.code];
      html += `<div class="strength-item" style="margin-bottom:10px;"><strong>${s.code} ${s.name}</strong>（平均得分率 ${rate.toFixed(0)}%）<br><span style="font-size:13px;color:#555;">${info ? info.strength : ''}</span></div>`;
    }

    const weakList = avgList.filter(s => s.avgScore / s.maxScore < 0.7);
    if (weakList.length > 0) {
      html += `<p style="font-size:15px;margin:20px 0 10px;"><strong>三、薄弱板块诊断</strong></p>`;
      for (const s of weakList) {
        const rate = s.avgScore / s.maxScore * 100;
        const info = A_ANALYSIS[s.code];
        let level = rate < 60 ? '严重薄弱' : '有待加强';
        html += `<div class="weakness-item" style="margin-bottom:10px;"><strong>${s.code} ${s.name}</strong>（平均得分率 ${rate.toFixed(0)}%，${level}）<br><span style="font-size:13px;color:#555;">${info ? info.weakness : ''}</span></div>`;
      }
    }

    html += `<p style="font-size:15px;margin:20px 0 10px;"><strong>四、改进建议</strong></p>`;
    const bottom2 = avgList.slice(-2).reverse();
    for (const s of bottom2) {
      const info = A_ANALYSIS[s.code];
      html += `<div style="background:#fff8e1;padding:12px 15px;border-radius:6px;margin-bottom:10px;border-left:4px solid #f39c12;"><strong>【${s.code} ${s.name}】</strong><br><span style="font-size:13px;color:#555;">${info ? info.advice : ''}</span></div>`;
    }
    html += `<div style="background:#eaf2f8;padding:12px 15px;border-radius:6px;margin-top:10px;"><strong>总体建议：</strong><span style="font-size:13px;color:#555;">建议学校以本次评价结果为依据，成立职教质量提升工作小组，对照评价体系制定三年提升规划和年度改进清单。优先补齐权重高、得分低的板块，定期开展校内自评，持续跟踪改进成效。</span></div>`;
    html += '</div>';
  }

  return html;
}

// ===== 返回首页 =====
function goHome() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('summaryScreen').classList.add('hidden');
  document.getElementById('homeScreen').classList.remove('hidden');
  refreshHomeTip();
  window.scrollTo(0,0);
}

function clearMyData() {
  if (currentUser.type === 'admin') { alert('管理员不能清空数据'); return; }
  if (!confirm('确定要清空本校所有评价数据吗？此操作不可恢复。')) return;
  const data = getStorage();
  data.schools[currentUser.name] = { records: [] };
  setStorage(data);
  goHome();
}
